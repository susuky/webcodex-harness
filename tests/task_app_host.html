<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task App 診斷測試頁</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;margin:24px;color:#202322;background:#f4f6f4}
  main{max-width:920px;margin:auto}h1{font-size:22px;margin:0}p{margin:8px 0}
  .counters{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0}output{font-weight:650}
  button{font:inherit;padding:7px 12px;margin-right:8px;background:white;border:1px solid #b9c5bc;border-radius:5px}
  iframe{display:block;margin-top:20px;width:100%;height:760px;border:1px solid #cbd4cd;background:white}
  pre{font:13px/1.5 monospace;white-space:pre-wrap;background:#fff;padding:12px;max-height:180px;overflow:auto}
</style>
<main>
  <h1>Task App 診斷測試頁</h1>
  <p>本機模擬 Host 會載入同目錄的真實 task_app.html，記錄工具呼叫與 ui/message 次數，供續接流程測試。</p>
  <p>模式：<output id="mode"></output>。before 模擬 prepare 未送達；after 模擬已保存 prepared 後遺失回覆，等待卡片的十秒逾時。stateFailures=1 會使下一筆狀態查詢失敗。</p>
  <div class="counters">
    <span>Prepare：<output id="prepare-count">0</output></span>
    <span>ui/message：<output id="ui-message-count">0</output></span>
    <span>實際等待狀態：<output id="wait-state">ready</output></span>
    <span>狀態查詢失敗：<output id="state-failure-count">0</output></span>
    <span>Bind：<output id="bind-count">0</output></span>
    <span>狀態查詢：<output id="state-query-count">0</output></span>
    <span>世代：<output id="generation">1</output></span>
    <span>自動傳訊：<output id="paused">false</output></span>
    <span>成果讀取：<output id="review-count">0</output></span>
  </div>
  <button id="inspect" type="button">更新診斷數值</button>
  <button id="fail-state" type="button">下一次狀態查詢失敗</button>
  <button id="toggle-pause" type="button">切換模擬 Host 自動模式</button>
  <button id="replace-controller" type="button">更換模擬控制世代</button>
  <button id="limit-review" type="button">下一次成果讀取限流</button>
  <button id="drop-review" type="button">下一次成果回覆遺失</button>
  <span id="activity-controls" hidden><button id="image-activity" type="button">模擬檢視圖片</button><button id="file-activity" type="button">模擬修改檔案</button><button id="task-activity" type="button">模擬另一連線工具活動</button><button id="quiet-activity" type="button">模擬工具靜默</button></span>
  <pre id="host-log" aria-label="模擬 Host 記錄"></pre>
  <iframe id="app" src="./task_app.html" title="真實 Task App（模擬連線）"></iframe>
</main>
<script>
(() => {
  "use strict";
  const query = new URLSearchParams(location.search);
  const mode = ["before", "after"].includes(query.get("mode")) ? query.get("mode") : "none";
  const stateFailures = query.get("stateFailures") === "1" ? 1 : 0;
  const activity = query.has("activity");
  const reviewMode = query.get("review");
  let limitedReviews = reviewMode === "rate" ? 1 : 0, droppedReviews = reviewMode === "drop" ? 1 : 0;
  const app = document.getElementById("app");
  const taskId = "1".repeat(32), waitId = "2".repeat(32);
  const host = {state:"ready",generation:1,bound:true,paused:false,autoEnabled:false,autoCount:0,maximum:3,interval:60,deliveries:[],view:null,prepare:0,messages:0,binds:0,stateCalls:0,failedStates:0,pendingStateFailures:0,reviews:0,operation:"檢視圖片",activityStartedAt:Date.now()/1000-6,activityFinishedAt:Date.now()/1000-5,activityOutcome:"returned",taskActivityAge:null};
  const logs = [];
  const el = id => document.getElementById(id);
  el("mode").textContent = activity ? "工具活動（不安排續接）" : mode;
  el("activity-controls").hidden = !activity;
  function inspect() {
    for (const [id,key] of [["prepare-count","prepare"],["ui-message-count","messages"],["wait-state","state"],
      ["state-failure-count","failedStates"],["bind-count","binds"],["state-query-count","stateCalls"],["generation","generation"],["paused","autoEnabled"],["review-count","reviews"]])
      el(id).textContent = String(host[key]);
    el("host-log").textContent = logs.join("\n");
  }
  function log(value) { logs.push(value); if (logs.length > 30) logs.shift(); inspect(); }
  function send(data) { app.contentWindow.postMessage({jsonrpc:"2.0",...data},location.origin); }
  function result(control={}) {
    const now = Date.now()/1000;
    return {task:{id:taskId,title:"確認原任務的續接",status:"active",plan:[{step:"檢查續接結果",status:"in_progress"}]},
      progress:{state:activity ? "observing" : "ready",runner_online:true,pending_count:0,updated:now,
        last_job_update:host.taskActivityAge === null ? null : now-host.taskActivityAge,
        liveness:{observed_at:now,runner_last_seen:now-1,operation:host.operation,
          conversation:host.activityStartedAt === null ? null : {outcome:host.activityOutcome,started_at:host.activityStartedAt,finished_at:host.activityFinishedAt},
          host_turn_state:"unknown",data_freshness:"live",work:{running_count:0,pending_count:0,observed_at:now}}},
      continuation:{paused:host.paused,auto_enabled:host.autoEnabled,wait:activity ? null : {id:waitId,state:host.state},
        controller:{state:host.bound ? "owned" : "other",generation:host.generation,updated_at:now,lease_until:now+120},
        policy:{max_auto_messages:host.maximum,min_interval_seconds:host.interval,auto_message_count:host.autoCount,
          auto_blocked_reason:!host.autoEnabled?"disabled":host.autoCount>=host.maximum?"limit":null},deliveries:host.deliveries},
      handoff:{goal:"驗證卡片發訊與跨對話接棒",changed_files:["src/webcodex/task_app.html"],validation:["監看模式發訊 0 次"],issues:[],next_steps:["檢查手動接續結果"],unread_outputs:[]},control};
  }
  function toolResult(value) { return {structuredContent:value,content:[{type:"text",text:JSON.stringify(value)}],isError:false}; }
  function taskApp(args) {
    if (args.task_id !== taskId) throw new Error("wrong task");
    const action = args.action;
    log(`task_app ${action}`);
    if (action === "bind" || action === "takeover") {
      if (action === "bind" && !host.bound) return result({bound:false,reason:"another_view"});
      host.bound = true; host.binds++; host.view = args.view_id; host.autoEnabled = false;
      if (action === "takeover") { host.generation++; host.state = "ready"; host.deliveries = []; }
      return result({bound:true,generation:host.generation});
    }
    if (args.generation !== host.generation || args.view_id !== host.view) throw new Error("controller changed");
    if (action === "state") {
      host.stateCalls++;
      if (host.pendingStateFailures > 0) {
        host.pendingStateFailures--; host.failedStates++;
        throw new Error("simulated state transport failure");
      }
      return result({bound:host.bound,generation:host.generation,paused:host.paused});
    }
    if (action === "pause" || action === "enable") {
      host.paused = action === "pause"; host.autoEnabled = action === "enable"; return result({paused:host.paused});
    }
    if (action === "configure") { host.maximum=args.max_auto_messages;host.interval=args.min_interval_seconds;return result({}); }
    if (action === "unbind") {host.autoEnabled=false;return result({bound:false});}
    if (args.wait_id && args.wait_id !== waitId) throw new Error("wrong wait");
    if (action === "prepare" || action === "prepare_manual") {
      host.prepare++;
      if (host.deliveries.length) return result({wait_id:waitId,state:host.state,duplicate:true});
      if (host.state !== "ready" || action === "prepare" && !host.autoEnabled) throw new Error("wait is not sendable");
      if (action === "prepare") host.autoCount++;
      if (host.prepare === 1 && mode === "before") {
        host.pendingStateFailures = stateFailures;
        throw new Error("prepare never reached Server");
      }
      host.state = "prepared";
      host.deliveries.push({id:String(host.prepare),mode:action==="prepare"?"auto":"manual",reason:action==="prepare"?"jobs_completed":"user_resume",status:"prepared",content:"本機模擬的續接通知。",created:Date.now()/1000});
      if (host.prepare === 1 && mode === "after") {
        host.pendingStateFailures = stateFailures;
        return null;
      }
      return result({wait_id:waitId,state:"prepared",app_protocol:{message:"本機模擬的續接通知。"}});
    }
    if (action === "finish") {
      if (!["prepared","accepted","unknown"].includes(host.state)) throw new Error("wait was not prepared");
      host.state = host.state === "unknown" ? "unknown" : args.outcome;
      if(host.deliveries.length)host.deliveries.at(-1).status=host.state;
      return result({wait_id:waitId,state:host.state});
    }
    throw new Error("unsupported action");
  }
  addEventListener("message",event => {
    if (event.source !== app.contentWindow || event.origin !== location.origin || event.data?.jsonrpc !== "2.0") return;
    const {id,method,params={}} = event.data;
    try {
      let value;
      if (method === "ui/initialize") value = {protocolVersion:"2026-01-26",hostInfo:{name:"local-test-host",version:"1"},hostCapabilities:{}};
      else if (method === "ui/notifications/initialized") {
        send({method:"ui/notifications/tool-input",params:{arguments:{task_id:taskId}}}); return;
      } else if (method === "tools/call" && params.name === "task_app") {
        value = taskApp(params.arguments);
        if (value === null) { log("prepared persisted; response intentionally withheld"); return; }
        value = toolResult(value);
      } else if (method === "tools/call" && params.name === "task_review") {
        host.reviews++;
        if (limitedReviews > 0) {
          limitedReviews--; log("review rate limited");
          send({id,error:{code:429,message:"Too many requests",data:{retry_after:15}}}); return;
        }
        if (droppedReviews > 0) { droppedReviews--; log("review response withheld"); return; }
        value = toolResult({task_id:taskId,review:{is_git_repository:true,files:[],total_files:0,files_truncated:false,
          preview:null,executions:reviewMode ? [{process_id:"review-recovery",status:"completed",exit_code:0,
            command:["echo","card recovery"],output:"原工作結果已恢復讀取。"}] : [],observed_at:Date.now()/1000}});
      } else if (method === "ui/message") {
        host.messages++; log("ui/message counted locally; no model started"); value = {};
      } else if (method === "ui/notifications/size-changed") {
        if (Number.isFinite(params.height)) app.style.height = Math.max(550,Math.min(1600,params.height)) + "px";
        return;
      } else return;
      if (id !== undefined) send({id,result:value});
    } catch (error) {
      log(error.message);
      if (id !== undefined) send({id,error:{code:-32000,message:error.message}});
    } finally { inspect(); }
  });
  el("inspect").addEventListener("click",inspect);
  el("fail-state").addEventListener("click",() => { host.pendingStateFailures++; log("next state will fail"); });
  el("limit-review").addEventListener("click",() => { limitedReviews++; log("next review will be rate limited"); });
  el("drop-review").addEventListener("click",() => { droppedReviews++; log("next review response will be withheld"); });
  el("toggle-pause").addEventListener("click",() => { host.autoEnabled = !host.autoEnabled; log("host automatic messaging toggled"); });
  el("replace-controller").addEventListener("click",() => {
    host.generation++;
    if (["prepared","accepted"].includes(host.state)) host.state = "unknown";
    log("controller generation replaced");
  });
  for (const [id,operation,seconds] of [["image-activity","檢視圖片",5],["file-activity","修改檔案",5],["quiet-activity","檢視圖片",300]]) {
    el(id).addEventListener("click",() => { host.operation = operation; host.activityStartedAt = Date.now()/1000-seconds; host.activityFinishedAt = host.activityStartedAt+1; host.taskActivityAge = null; log("activity changed"); });
  }
  el("task-activity").addEventListener("click",() => {
    host.taskActivityAge = 5; log("another connection updated this task");
  });
  window.taskCardTest = {host,inspect};
  inspect();
})();
</script>
</html>
