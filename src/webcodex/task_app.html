<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>任務與修改內容</title>
  <style>
    @layer base, layout, components, preferences;

    @layer base {
      :root {
        color-scheme: light dark;
        font-family: "IBM Plex Sans", "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-size: 90%;
        line-height: 1.6;
        --mono: "IBM Plex Mono", ui-monospace, "Noto Sans Mono", monospace;
        --ink: var(--color-text-primary, light-dark(#202b31, #e4eef0));
        --muted: var(--color-text-secondary, light-dark(#5c6b73, #a7b8c0));
        --surface: var(--color-background-primary, light-dark(#fff, #152127));
        --soft: var(--color-background-secondary, light-dark(#f3f7f8, #1d2e35));
        --line: var(--color-border-tertiary, light-dark(#dce5e8, #34464e));
        --control-line: var(--color-border-secondary, light-dark(#83959d, #839ba5));
        --accent: light-dark(#086c70, #78dad4);
        --accent-ink: light-dark(#fff, #102b2d);
        --accent-soft: light-dark(#e6f4f3, #173d40);
        --good: light-dark(#237143, #99dcb1);
        --good-bg: light-dark(#eaf5ed, #203d2d);
        --bad: light-dark(#a53f36, #ffb1a8);
        --bad-bg: light-dark(#fff0ed, #462c2a);
        --warning: light-dark(#8b5d12, #e4bb72);
        color: var(--ink);
        background: var(--surface);
        accent-color: var(--accent);
      }
      :root[data-theme=dark] { color-scheme: dark; }
      :root[data-theme=light] { color-scheme: light; }
      @supports not (color: light-dark(white, black)) {
        :root {
          --ink: var(--color-text-primary, #202b31);
          --muted: var(--color-text-secondary, #5c6b73);
          --surface: var(--color-background-primary, #fff);
          --soft: var(--color-background-secondary, #f3f7f8);
          --line: var(--color-border-tertiary, #dce5e8);
          --control-line: var(--color-border-secondary, #83959d);
          --accent: #086c70; --accent-ink: #fff; --accent-soft: #e6f4f3;
          --good: #237143; --good-bg: #eaf5ed;
          --bad: #a53f36; --bad-bg: #fff0ed; --warning: #8b5d12;
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme=light]) {
            --ink: var(--color-text-primary, #e4eef0);
            --muted: var(--color-text-secondary, #a7b8c0);
            --surface: var(--color-background-primary, #152127);
            --soft: var(--color-background-secondary, #1d2e35);
            --line: var(--color-border-tertiary, #34464e);
            --control-line: var(--color-border-secondary, #839ba5);
            --accent: #78dad4; --accent-ink: #102b2d; --accent-soft: #173d40;
            --good: #99dcb1; --good-bg: #203d2d;
            --bad: #ffb1a8; --bad-bg: #462c2a; --warning: #e4bb72;
          }
        }
        :root[data-theme=dark] {
          --ink: var(--color-text-primary, #e4eef0);
          --muted: var(--color-text-secondary, #a7b8c0);
          --surface: var(--color-background-primary, #152127);
          --soft: var(--color-background-secondary, #1d2e35);
          --line: var(--color-border-tertiary, #34464e);
          --control-line: var(--color-border-secondary, #839ba5);
          --accent: #78dad4; --accent-ink: #102b2d; --accent-soft: #173d40;
          --good: #99dcb1; --good-bg: #203d2d;
          --bad: #ffb1a8; --bad-bg: #462c2a; --warning: #e4bb72;
        }
      }
      :where(main, section, header, footer, div, ol, ul, li, dl, dt, dd, details, summary, button, input, progress, pre, p) {
        box-sizing: border-box;
      }
      body { margin: 0; container: task-card / inline-size; }
      :where(h1, h2, h3, p, dl) { margin: 0; }
      h1 { font-size: clamp(1.25rem, 1.1rem + .8cqi, 1.75rem); font-weight: 650; line-height: 1.4; letter-spacing: -.025em; overflow-wrap: anywhere; }
      h2 { font-size: 1rem; font-weight: 650; }
      h3 { font-size: .875rem; font-weight: 650; }
      :where(button, input) { font: inherit; color: inherit; }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        min-block-size: 2.75rem;
        padding-block: .55rem;
        padding-inline: 1rem;
        border: 1px solid var(--control-line);
        border-radius: .5rem;
        background: var(--surface);
        font-size: .875rem;
        font-weight: 550;
        line-height: 1.5;
        cursor: pointer;
      }
      button:disabled { opacity: .45; cursor: default; }
      :where(button, input, summary, pre, [role=tabpanel]):focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      button:active:not(:disabled) { background: var(--line); }
      summary { min-block-size: 2.75rem; padding-block: .6rem; cursor: pointer; }
      summary::marker { color: var(--muted); font-size: .8em; }
      [hidden] { display: none !important; }
      ::selection { background: var(--accent-soft); color: var(--ink); }
      @media (hover: hover) {
        button:hover:not(:disabled) { background: var(--soft); border-color: var(--accent); }
        summary:hover { color: var(--accent); }
      }
      @media (prefers-reduced-motion: no-preference) {
        :where(button, summary) { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
      }
      @media (forced-colors: active) {
        button[aria-pressed=true], button[aria-selected=true], .current { outline: 2px solid Highlight; outline-offset: -2px; }
      }
    }

    @layer layout {
      main { inline-size: 100%; max-inline-size: 62rem; margin-inline: auto; padding: clamp(1.25rem, 3.3cqi, 2rem); }
      .task-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
      .task-heading { display: flex; align-items: flex-start; gap: .75rem; min-inline-size: 0; flex: 1 1 18rem; }
      .task-heading svg { inline-size: 1.5rem; block-size: 1.5rem; flex: none; margin-block-start: .3rem; color: var(--accent); }
      .task-state { margin-block-start: 1.125rem; }
      .activity { margin-block-start: 1.5rem; }
      .activity dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 2rem; }
      .activity dl > div { min-inline-size: 0; }
      .activity dt { margin-block-end: .2rem; color: var(--muted); font-size: .75rem; }
      .activity dd { margin: 0; font-size: .875rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .footer-actions { display: flex; flex-wrap: wrap; gap: .625rem; margin-block-start: 1.25rem; }
      .work-plan { margin-block-start: 1.5rem; border-block-start: 1px solid var(--line); padding-block-start: 1.25rem; }
      .work-plan:has(#steps:empty) { display: none; }
      .plan-progress { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1rem; }
      .plan-progress h2 { margin-inline-end: auto; }
      .messaging { margin-block-start: 1.5rem; padding-block: 1rem; border-block: 1px solid var(--line); font-size: .875rem; }
      .message-overview { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem; }
      .message-settings { display: flex; align-items: flex-end; flex-wrap: wrap; gap: .875rem; padding-block: .5rem 1rem; }
      .message-settings label { display: flex; flex-direction: column; gap: .375rem; flex: 1 1 9rem; max-inline-size: 14rem; }
      .handoff { border-block-end: 1px solid var(--line); padding-block: .25rem; font-size: .875rem; }
      #handoff-content { padding-block: .25rem 1rem; }
      .review { margin-block: 1.5rem; }
      .review > header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem; }
      .review-layout { display: grid; grid-template-columns: minmax(10rem, 13rem) minmax(0, 1fr); gap: 1.25rem; margin-block-start: .875rem; }
      .review-layout.empty { grid-template-columns: 1fr; }
      footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem; border-block-start: 1px solid var(--line); padding-block-start: 1rem; }
      @container task-card (inline-size < 36rem) {
        .activity dl { grid-template-columns: 1fr; gap: .875rem; }
        .activity dl > div { display: grid; grid-template-columns: 7rem minmax(0, 1fr); column-gap: .875rem; }
        .activity dt { padding-block-start: .1rem; margin: 0; }
        .review-layout { grid-template-columns: 1fr; gap: 1rem; }
        .file-list { --file-list-max: 13rem; }
        .message-overview { align-items: flex-start; flex-direction: column; }
        .message-count { padding-inline-start: 2rem; }
      }
      @container task-card (inline-size < 24rem) {
        main { padding: 1rem; }
        .task-heading { flex-basis: 100%; }
        .activity dl > div { grid-template-columns: 1fr; gap: .15rem; }
        .footer-actions button { flex: 1 1 auto; }
        .plan-progress h2 { flex-basis: 100%; }
        .message-settings label { max-inline-size: none; }
        .message-settings button { inline-size: 100%; }
      }
    }

    @layer components {
      .signal { display: inline-flex; align-items: center; gap: .45rem; min-block-size: 1.75rem; padding-inline: .625rem; border: 1px solid var(--line); border-radius: 2rem; white-space: nowrap; color: var(--muted); font-size: .75rem; }
      .dot { inline-size: .4rem; block-size: .4rem; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.live { background: var(--accent); }
      .dot.attention { background: var(--warning); }
      #status { display: inline-block; padding: .3rem .65rem; border-radius: .375rem; background: var(--accent-soft); color: var(--accent); font-size: .875rem; font-weight: 600; }
      #detail { max-inline-size: 65ch; margin-block-start: .625rem; color: var(--muted); font-size: .875rem; }
      #detail:empty { display: none; }
      .work-observation { display: block; margin-block-start: .15rem; color: var(--muted); font-size: .75rem; }
      .activity[data-attention=true] { border-inline-start: 3px solid var(--warning); padding-inline-start: 1rem; }
      #resume { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      #resume:hover:not(:disabled) { background: color-mix(in srgb, var(--accent), var(--ink) 16%); }
      #takeover { color: var(--accent); border-color: var(--accent); }
      #step-summary { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
      progress { appearance: none; inline-size: 5rem; max-inline-size: 35%; block-size: .25rem; border: 0; border-radius: 1rem; background: var(--soft); color: var(--accent); }
      progress::-webkit-progress-bar { background: var(--soft); border-radius: 1rem; }
      progress::-webkit-progress-value { background: var(--accent); border-radius: 1rem; }
      progress::-moz-progress-bar { background: var(--accent); border-radius: 1rem; }
      #steps { list-style: none; margin-block: .75rem 0; padding: 0; max-block-size: 20rem; overflow: auto; overscroll-behavior: contain; }
      #steps li { display: flex; align-items: baseline; gap: .75rem; padding-block: .65rem; font-size: .875rem; }
      #steps li:not(:last-child) { border-block-end: 1px solid var(--line); }
      .step-text { min-inline-size: 0; overflow-wrap: anywhere; }
      .step { display: inline-grid; place-items: center; flex: none; inline-size: 1.5rem; block-size: 1.5rem; border: 1px solid var(--line); border-radius: .375rem; color: var(--muted); background: var(--soft); font: .75rem/1 var(--mono); }
      .done .step { border-color: transparent; background: var(--good-bg); color: var(--good); }
      .current { font-weight: 600; }
      .current .step { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      .step-state { margin-inline-start: auto; flex: none; padding: .1rem .45rem; border-radius: .25rem; color: var(--accent); background: var(--accent-soft); font-size: .75rem; white-space: nowrap; }
      .toggle { display: flex; align-items: center; gap: .75rem; min-block-size: 2.75rem; font-weight: 550; cursor: pointer; }
      .toggle input { margin: 0; inline-size: 1.25rem; block-size: 1.25rem; flex: none; }
      .toggle:has(:disabled) { color: var(--muted); cursor: default; }
      .message-count { color: var(--muted); font-size: .75rem; }
      #auto-count { margin-inline-start: .4rem; color: var(--ink); font-family: var(--mono); font-size: .875rem; font-variant-numeric: tabular-nums; }
      .messaging summary { inline-size: fit-content; }
      .message-settings input { inline-size: 100%; min-inline-size: 0; min-block-size: 2.75rem; padding: .5rem .75rem; border: 1px solid var(--control-line); border-radius: .5rem; background: var(--surface); font-size: 1rem; font-variant-numeric: tabular-nums; }
      .message-settings input:user-invalid { border-color: var(--bad); }
      .delivery { border-block-start: 1px solid var(--line); padding-block: .375rem; }
      .delivery summary { inline-size: auto; }
      .delivery p { margin-block: .5rem; }
      .delivery pre { white-space: pre-wrap; overflow-wrap: anywhere; max-block-size: 10rem; }
      .handoff h3 { margin-block: .875rem .25rem; }
      .handoff p, .handoff li { margin-block: .25rem; overflow-wrap: anywhere; }
      .handoff ul { padding-inline-start: 1.25rem; margin-block: .25rem; }
      .review-tabs { display: flex; gap: 1.5rem; margin-block-start: .75rem; border-block-end: 1px solid var(--line); }
      .review-tabs button { border: 0; border-block-end: 2px solid transparent; border-radius: 0; padding-inline: .25rem; background: transparent; color: var(--muted); }
      .review-tabs button[aria-selected=true] { border-block-end-color: var(--accent); color: var(--accent); font-weight: 650; }
      .count { display: inline-block; min-inline-size: 1.25rem; padding-inline: .3rem; border-radius: .25rem; background: var(--soft); color: var(--muted); font: .75rem/1.6 var(--mono); font-variant-numeric: tabular-nums; }
      .count:empty { display: none; }
      .review-state, .review-note, .run-summary { color: var(--muted); font-size: .75rem; margin-block-start: .75rem; }
      .review-state:empty, .review-note:empty, .run-summary:empty { display: none; }
      #policy-error { color: var(--bad); }
      .file-list { display: flex; flex-direction: column; gap: .25rem; max-block-size: var(--file-list-max, 25rem); overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
      .file-list button { display: block; flex: none; inline-size: 100%; text-align: start; padding: .625rem .75rem; border-color: transparent; overflow-wrap: anywhere; }
      .file-list button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
      .file-name { display: block; font-size: .8125rem; font-weight: 600; }
      .file-directory, .file-state { display: block; font-size: .75rem; color: var(--muted); }
      .file-state { margin-block-start: .25rem; }
      .preview { min-inline-size: 0; }
      .preview h3 { overflow-wrap: anywhere; }
      .preview p, .run p { margin-block: .5rem; font-size: .8125rem; color: var(--muted); }
      .preview:has(> p:only-child) { padding: 1rem; border: 1px dashed var(--line); border-radius: .5rem; }
      pre { max-inline-size: 100%; max-block-size: 25rem; margin-block: .625rem 0; padding: 1rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--soft); overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; font: .75rem/1.8 var(--mono); tab-size: 4; white-space: pre; }
      pre code { font: inherit; }
      .diff { padding-block: .75rem; padding-inline: 0; }
      .diff span { display: block; min-inline-size: max-content; padding-inline: 1rem; }
      .diff-add { color: var(--good); background: var(--good-bg); }
      .diff-remove { color: var(--bad); background: var(--bad-bg); }
      .diff-heading { color: var(--muted); }
      #runs { margin-block-start: .875rem; }
      .run { margin-block-start: .625rem; border: 1px solid var(--line); border-radius: .5rem; padding-inline: .875rem; }
      .run summary { padding-block: .75rem; font-size: .8125rem; overflow-wrap: anywhere; }
      .run[open] { padding-block-end: .875rem; }
      .outcome { display: inline-block; margin-inline-end: .75rem; padding: .125rem .4rem; border-radius: .25rem; background: var(--soft); font-size: .75rem; font-weight: 600; }
      .run[data-status=completed] .outcome { color: var(--good); background: var(--good-bg); }
      .run:is([data-status=failed], [data-status=timed_out], [data-status=interrupted]) .outcome { color: var(--bad); background: var(--bad-bg); }
      .run[data-status=running] .outcome { color: var(--accent); background: var(--accent-soft); }
      .run summary code { font: .75rem/1.7 var(--mono); }
      .run-count-failed { color: var(--bad); font-weight: 600; }
      .updated { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
    }
    @layer preferences {
      @media (pointer: coarse) {
        :where(button, summary, .toggle, .message-settings input) { min-block-size: max(3rem, 44px); }
        .message-settings input { font-size: max(1rem, 16px); }
      }
    }
  </style>
</head>
<body>
<main aria-label="任務進度">
  <header class="task-header">
    <div class="task-heading"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 5 6 7-6 7M13 19h7"/></svg><h1 id="title">任務進度</h1></div>
    <div class="signal"><span id="dot" class="dot" aria-hidden="true"></span><span id="connection">卡片連線中</span></div>
  </header>
  <section class="task-state" aria-live="polite" aria-atomic="true"><p id="status">正在讀取任務</p><p id="detail"></p></section>
  <section id="activity" class="activity" aria-label="連線與工作狀態">
    <dl>
      <div><dt>Runner 連線</dt><dd id="runner-activity">確認中</dd></div>
      <div><dt>工作狀態</dt><dd id="work-observation"></dd></div>
      <div><dt>本對話工具呼叫</dt><dd id="conversation-activity">尚無紀錄</dd></div>
      <div><dt>卡片控制權</dt><dd><span id="controller-state">確認中</span><span id="controller-updated" class="work-observation"></span></dd></div>
    </dl>
    <div class="footer-actions"><button id="check-status" type="button" disabled>更新狀態</button><button id="takeover" type="button" hidden>在此接手</button><button id="resume" type="button" disabled>接續工作</button></div>
  </section>
  <section class="work-plan">
    <div id="plan-progress" class="plan-progress" hidden><h2>工作步驟</h2><span id="step-summary"></span><progress id="step-progress" aria-labelledby="step-summary"></progress></div>
    <ol id="steps" role="list" aria-label="工作步驟"></ol>
  </section>
  <section class="messaging" aria-label="接續工作設定">
    <div class="message-overview"><label class="toggle" for="auto-message"><input id="auto-message" type="checkbox" disabled>完成後自動傳訊</label><p class="message-count">本任務自動發訊次數 <span id="auto-count">0 / 3</span></p></div>
    <p id="continuation-state" class="review-state" aria-live="polite"></p>
    <details id="message-settings"><summary>發訊設定</summary><div class="message-settings"><label for="max-auto-messages">最多次數<input id="max-auto-messages" type="number" min="0" max="20" value="3" inputmode="numeric" aria-describedby="policy-error"></label><label for="min-interval">最短間隔（秒）<input id="min-interval" type="number" min="10" max="86400" value="60" inputmode="numeric" aria-describedby="policy-error"></label><button id="save-policy" type="button" disabled>儲存</button></div><p id="policy-error" class="review-state" role="status"></p></details>
    <details id="delivery-history" hidden><summary>發訊紀錄</summary><div id="deliveries"></div></details>
  </section>
  <details id="handoff" class="handoff" hidden><summary>接棒資訊</summary><div id="handoff-content"></div></details>
  <section class="review" aria-labelledby="review-title">
    <header><h2 id="review-title">檢查成果</h2><button id="review-refresh" type="button">讀取成果</button></header>
    <div class="review-tabs" role="tablist" aria-label="檢視內容"><button id="changes-tab" type="button" role="tab" aria-selected="true" aria-controls="changes">修改內容<span id="changes-count" class="count"></span></button><button id="runs-tab" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="runs">執行結果<span id="runs-count" class="count"></span></button></div>
    <p id="review-state" class="review-state" role="status">尚未讀取成果</p>
    <div id="changes" role="tabpanel" aria-labelledby="changes-tab" tabindex="0"><p class="review-note" id="changes-note"></p><div id="review-layout" class="review-layout"><div id="files" class="file-list" aria-label="檔案清單"></div><div id="preview" class="preview"></div></div></div>
    <div id="runs" role="tabpanel" aria-labelledby="runs-tab" tabindex="0" hidden><p id="run-summary" class="run-summary"></p><div id="executions"></div></div>
  </section>
  <footer><span id="updated" class="updated">尚未取得進度</span><button id="reconnect" type="button" hidden>重新連線</button></footer>
</main>
<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const pending = new Map();
  const attempted = new Set();
  const taskPattern = /^[0-9a-f]{32}$/;
  let sequence = 0, taskId = null, generation = null, ready = false, stopped = false;
  let busy = false, timer = null, nextPollAt = 0, last = null, pendingFinish = null;
  let autoConsent = false, sending = false, changingPolicy = false, manualSequence = 0, manualRequest = null, manualWaitId = null;
  let failedPrepare = null;
  let activityReceivedAt = 0, connectionFailed = false, stateCopy = null;
  let consentRevision = 0;
  let reviewVersion = 0, reviewLoaded = false, selectedPath = null, pendingReview = null;
  let reviewTimer = null, retryAt = 0, retryDelay = 15000, retryLimited = false, lastHeight = null;
  const viewId = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,"0")).join("");
  const states = {
    ready: ["目前沒有執行中的工作", ""],
    observing: ["背景工作執行中", ""],

      if (value.review) {
        pendingReview = null;
        if (Date.now() >= retryAt) retryDelay = 15000;
        const files = value.review.files || [];
        if (selectedPath && !files.some(file => file.path === selectedPath) && !value.review.files_truncated) selectedPath = null;
        showReview(value.review);
        if (!selectedPath && files.length) { void loadReview(files[0].path); }
        return;
      }
      const job = value.review_job;
      if (!job || !["queued","running"].includes(job.status)) {
        el("review-state").textContent = "目前無法取得修改內容，請在對話中確認原因後重試。";
        pendingReview = null; return;
      }
      pendingReview = {path,jobId:job.job_id,requestId};
      el("review-state").textContent = job.runner_online === false
        ? "電腦未連線，稍後自動重試。" : "仍在讀取，完成後會更新。";
      scheduleReview(15000);
    } catch (error) {
      if (version === reviewVersion && !stopped) {
        el("review-state").textContent = (error.rate_limited ? "請求暫時受限" : "暫時無法讀取成果")
          + (el("review-state").dataset.loaded === "true" ? "，保留上次結果；稍後自動重試。" : "，稍後自動重試。");
        scheduleReview(deferRetry(error));
      }
    } finally {
      if (version === reviewVersion) {
        el("review-refresh").disabled = false; el("review-refresh").textContent = pendingReview ? "重試" : "重新整理";
        el("changes").setAttribute("aria-busy","false"); el("runs").setAttribute("aria-busy","false");
      }
    }
  }
  el("review-refresh").addEventListener("click",() => void loadReview(pendingReview?.path ?? selectedPath,pendingReview?.jobId ?? null,pendingReview?.requestId ?? null));
  function selectTab(tab) {
    for (const name of ["changes","runs"]) {
      el(name).hidden = name !== tab;
      el(name+"-tab").setAttribute("aria-selected",String(name === tab));
      el(name+"-tab").tabIndex = name === tab ? 0 : -1;
    }
    notify("ui/notifications/size-changed",{height:document.documentElement.scrollHeight});
  }
  for (const tab of ["changes","runs"]) {
    el(tab+"-tab").addEventListener("click",() => selectTab(tab));
    el(tab+"-tab").addEventListener("keydown",event => {
      if (!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === "Home" ? "changes" : event.key === "End" ? "runs" : tab === "changes" ? "runs" : "changes";
      selectTab(next); el(next+"-tab").focus();
    });
  }
  function schedule() {
    clearTimeout(timer);
    if (!stopped && !document.hidden && last?.task.status !== "completed") timer = setTimeout(poll,Math.max(0,nextPollAt-Date.now(),retryAt-Date.now()));
  }
  async function finish(waitId,outcome,error={}) {
    const metadata = {};
    if (["timeout","rpc_error","host_rejected","interrupted","invalid_prepare"].includes(error.delivery_error)) {
      metadata.delivery_error = error.delivery_error;
      const code = error.delivery_error_code;
      if (Number.isSafeInteger(code) && code >= -(2**31) && code < 2**31) metadata.delivery_error_code = code;
    }
    pendingFinish = {wait_id:waitId,outcome,generation,...metadata};
    const result = await call("finish",{wait_id:waitId,outcome,...metadata});
    pendingFinish = null; render(result);
  }
  async function dispatch(wait=null,manual=false,requestId=null) {
    if (stopped || document.hidden || sending || !controlled()) return;
    if (!manual && (!autoConsent || !last?.continuation.auto_enabled || last.continuation.policy?.auto_blocked_reason)) return;
    if (wait && attempted.has(wait.id)) return;
    sending = true;
    const attemptGeneration = generation, revision = consentRevision;
    if (wait) attempted.add(wait.id);
    el("resume").disabled = true; el("resume").textContent = "傳送中…";
    let prepared, waitId = wait?.id;
    try {
      const args = {request_id:requestId || `${viewId}:auto:${wait.id}`};
      if (waitId) args.wait_id = waitId;
      prepared = await call(manual ? "prepare_manual" : "prepare",args);
      const control = prepared.control;
      if (control?.duplicate) { render(prepared); return; }
      waitId = control?.wait_id;
      if (!waitId || control.state !== "prepared" || typeof control.app_protocol?.message !== "string"
          || control.app_protocol.message.length > 4096) throw deliveryError("invalid_prepare");
      attempted.add(waitId);
      if (manual) manualWaitId = waitId;
      let outcome = "not_sent", error = deliveryError("interrupted");
      if (!stopped && !document.hidden && controlled() && last?.task.status !== "completed"
          && generation === attemptGeneration && (manual || autoConsent && consentRevision === revision)) {
        outcome = "unknown";
        try {
          const response = await request("ui/message",{role:"user",content:[{type:"text",text:control.app_protocol.message}]});
          if (response?.isError) error = deliveryError("host_rejected");
          else { outcome = "accepted"; error = {}; }
        } catch (failure) { error = failure?.delivery_error ? failure : deliveryError("interrupted"); }
      }
      if (!stopped) { try { await finish(waitId,outcome,error); } catch (_) {} }
    } catch (error) {
      failedPrepare = {wait_id:waitId,generation:attemptGeneration};
      if (waitId) { try { await finish(waitId,"unknown",error?.delivery_error ? error : deliveryError("invalid_prepare")); } catch (_) {} }
      el("continuation-state").hidden = false;
      el("continuation-state").textContent = "傳送狀態待確認，更新狀態後可在此接手。";
    } finally {
      sending = false;
      if (last) renderMessaging(last);
    }
  }
  async function poll(manual=false) {
    if (!ready || !taskId || stopped || document.hidden || busy || sending) return;
    if (!manual && Date.now() < nextPollAt) { schedule(); return; }
    busy = true; el("check-status").disabled = true;
    try {
      let value;
      if (generation === null) {
        resetConsent();
        value = await call("bind");
        if (value.control?.bound) {
          if (!Number.isSafeInteger(value.control.generation) || value.control.generation < 1) throw new Error("invalid-bind");
          generation = value.control.generation;
        }
      } else value = await call("state");
      if (value.control?.bound === false) { generation = null; resetConsent(); }
      render(value);
      if (Date.now() >= retryAt) retryDelay = 15000;
      el("reconnect").hidden = true;
      if (!controlled(value) || value.task.status === "completed") return;
      const wait = value.continuation.wait;
      if (wait?.state === "ready" && failedPrepare?.wait_id === wait.id && failedPrepare.generation === generation
          && !value.continuation.deliveries?.some(item => item.wait_id === wait.id)) {
        attempted.delete(wait.id); failedPrepare = null;
      }
      if (pendingFinish) {
        if (pendingFinish.generation !== generation || pendingFinish.wait_id !== wait?.id
            || !["prepared","accepted","unknown"].includes(wait?.state)) pendingFinish = null;
        else { await finish(pendingFinish.wait_id,pendingFinish.outcome,pendingFinish); return; }
      }
      if (wait?.state === "prepared") {
        attempted.add(wait.id);
        await finish(wait.id,"unknown",deliveryError("interrupted"));
      } else if (wait?.state === "ready" && autoConsent) await dispatch(wait);
      if (wait?.state === "consumed") manualRequest = null;
    } catch (error) {
      deferRetry(error); generation = null; resetConsent(); connectionFailed = true;
      el("connection").textContent = "舊紀錄"; el("dot").className = "dot attention";
      el("detail").textContent = error.rate_limited ? "請求暫時受限，稍後重新連線。" : "卡片連線中斷，顯示上次紀錄。";
      el("reconnect").hidden = false; refreshActivity();
    } finally {
      const active = last?.progress?.liveness?.work;
      nextPollAt = Date.now() + (autoConsent || active?.running_count || active?.pending_count ? 10000 : generation === null ? 30000 : 60000);
      busy = false; el("check-status").disabled = false;
      if (last) renderMessaging(last);
      schedule();
    }
  }
  async function savePolicy() {
    const maximum = Number(el("max-auto-messages").value), interval = Number(el("min-interval").value);
    if (!Number.isSafeInteger(maximum) || maximum < 0 || maximum > 20 || !Number.isSafeInteger(interval) || interval < 10 || interval > 86400) {
      el("policy-error").textContent = "最多次數需為 0–20，最短間隔需為 10–86400 秒。";
      return false;
    }
    const value = await call("configure",{max_auto_messages:maximum,min_interval_seconds:interval});
    render(value); el("policy-error").textContent = ""; return true;
  }
  el("save-policy").addEventListener("click",async () => {
    if (!controlled() || changingPolicy || stopped) return;
    changingPolicy = true; el("save-policy").disabled = true;
    try { await savePolicy(); }
    catch (_) { el("policy-error").textContent = "儲存失敗，請更新狀態後重試。"; }
    finally { changingPolicy = false; if (last) renderMessaging(last); }
  });
  el("auto-message").addEventListener("change",async () => {
    const enabling = el("auto-message").checked;
    if (!controlled() || changingPolicy || stopped) { el("auto-message").checked = autoConsent; return; }
    resetConsent(); changingPolicy = true; el("auto-message").disabled = true;
    const revision = consentRevision, expectedGeneration = generation;
    try {
      const value = await call(enabling ? "enable" : "pause");
      if (revision === consentRevision && expectedGeneration === generation && value.continuation.auto_enabled === true && enabling) autoConsent = true;
      render(value);
      if (autoConsent) { nextPollAt = 0; schedule(); }
    } catch (_) { resetConsent(); el("policy-error").textContent = "設定尚未確認，請更新狀態後重試。"; }
    finally { changingPolicy = false; if (last) renderMessaging(last); }
  });
  el("resume").addEventListener("click",async () => {
    if (!controlled() || stopped || busy || sending || el("resume").disabled) return;
    manualRequest ||= `${viewId}:manual:${++manualSequence}`;
    await dispatch(last?.continuation.wait?.state === "consumed" ? null : last?.continuation.wait,true,manualRequest);
  });
  el("takeover").addEventListener("click",async () => {
    if (stopped || busy || sending) return;
    busy = true; resetConsent(); el("takeover").disabled = true;
    try {
      const value = await call("takeover");
      if (!value.control?.bound || !Number.isSafeInteger(value.control.generation)) throw new Error("invalid-bind");
      generation = value.control.generation; pendingFinish = null; failedPrepare = null; manualRequest = null; manualWaitId = null;
      render(value); el("handoff").open = true;
      nextPollAt = 0;
    } catch (_) { el("detail").hidden = false; el("detail").textContent = "接手失敗，請更新狀態後重試。"; }
    finally { busy = false; if (last) renderMessaging(last); schedule(); }
  });
  el("check-status").addEventListener("click",async () => {
    if (stopped || busy || sending) return;
    if (!ready) await initialize(); else await poll(true);
  });
  el("reconnect").addEventListener("click",async () => {
    if (stopped || busy || sending) return;
    resetConsent(); generation = null; el("reconnect").disabled = true;
    try {
      if (!ready) { await initialize(); return; }
      await poll(true);
      if (ready && taskId && reviewLoaded) await loadReview(selectedPath,pendingReview?.jobId ?? null,pendingReview?.requestId ?? null);
    } finally { el("reconnect").disabled = false; }
  });
  function teardown() {
    if (stopped) return;
    resetConsent();
    if (taskId && generation !== null) {
      parent.postMessage({jsonrpc:"2.0",id:++sequence,method:"tools/call",params:{name:"task_app",arguments:{task_id:taskId,action:"unbind",view_id:viewId,generation}}},"*");
    }
    stopped = true; clearTimeout(timer); clearTimeout(reviewTimer); clearInterval(activityTimer);
    for (const value of pending.values()) { clearTimeout(value.timeout); value.reject(deliveryError("interrupted")); }
    pending.clear();
  }
  addEventListener("message",event => {
    if (event.source !== parent || !event.data || event.data.jsonrpc !== "2.0") return;
    const data = event.data;
    if (pending.has(data.id)) {
      const item = pending.get(data.id); pending.delete(data.id); clearTimeout(item.timeout);
      if (data.error) item.reject(deliveryError("rpc_error",data.error.code,data.error)); else item.resolve(data.result);
      return;
    }
    if (data.method === "ui/notifications/tool-input") select(data.params?.arguments?.task_id);
    if (data.method === "ui/notifications/tool-result") {
      try { const value = payload(data.params); select(value.task?.id); if (value.task?.id === taskId) render(value); } catch (_) {}
    }
    if (data.method === "ui/notifications/host-context-changed") applyTheme(data.params);
    if (data.method === "ui/resource-teardown") {
      teardown();
      if (data.id !== undefined) parent.postMessage({jsonrpc:"2.0",id:data.id,result:{}},"*");
    }
  });
  addEventListener("visibilitychange",() => {
    clearTimeout(timer); clearTimeout(reviewTimer); reviewTimer = null;
    if (!document.hidden) {
      if (!busy && !sending && Date.now() >= nextPollAt) { resetConsent(); generation = null; }
      void poll();
      if (pendingReview) scheduleReview(15000);
    }
  });
  addEventListener("pagehide",teardown,{once:true});
  addEventListener("beforeunload",teardown,{once:true});
  function applyTheme(context) {
    if (["dark","light"].includes(context?.theme)) document.documentElement.dataset.theme = context.theme;
  }
  async function initialize() {
    el("check-status").disabled = true;
    try {
      const result = await request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"webcodex-task-progress",version:"1.0.0"},appCapabilities:{}});
      applyTheme(result?.hostContext);
      ready = true; el("reconnect").hidden = true;
      notify("ui/notifications/initialized"); void poll();
    } catch (_) {
      el("connection").textContent = "卡片尚未連線"; el("status").textContent = "無法載入任務卡片";
      el("detail").textContent = "請重新連線，或在對話中重新開啟任務卡片。";
      el("reconnect").hidden = false;
    } finally { el("check-status").disabled = false; }
  }
  const activityTimer = setInterval(() => {
    refreshActivity();
    if (!stopped) notify("ui/notifications/size-changed",{height:document.documentElement.scrollHeight});
  },5000);
  void initialize();
})();
</script>
</body>
</html>
