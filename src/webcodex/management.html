<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WebCodex 任務中心</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23096c77'/%3E%3Cpath d='m8 10 6 6-6 6m10 0h6' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
@layer theme, base, layout, components, preferences;

@layer theme {
  :root {
    color-scheme: light dark;
    --bg: #f5f7f8;
    --panel: #fff;
    --text: #202c32;
    --muted: #596970;
    --line: #dfe6e9;
    --control-line: #829198;
    --accent: #086c70;
    --on-accent: #fff;
    --selected: #e8f3f3;
    --hover: #f0f5f5;
    --bad: #ac3540;
    --attention: #805518;
    --attention-bg: #fff3dc;
    --radius: .5rem;
    --font: "IBM Plex Sans", "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: "IBM Plex Mono", "Noto Sans Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141c20;
      --panel: #1c272c;
      --text: #e7eef1;
      --muted: #aabac1;
      --line: #34464d;
      --control-line: #71868f;
      --accent: #87d7d6;
      --on-accent: #102c2e;
      --selected: #244044;
      --hover: #26373d;
      --bad: #ffadb5;
      --attention: #f2c781;
      --attention-bg: #413626;
    }
  }
}

@layer base {
  :where(html, body, main, section, div, header, form, search, label, button, input, select, dialog, p, dl, ol, li, pre, a) { box-sizing: border-box; }
  html { block-size: 100%; accent-color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.6 var(--font); }
  :where(h1, h2, h3, h4, p) { margin: 0; }
  h1 { font-size: 1.125rem; font-weight: 600; }
  h2 { font-size: clamp(1.25rem, 1.05rem + .7vw, 1.625rem); line-height: 1.5; font-weight: 650; overflow-wrap: anywhere; }
  h3 { margin-block: 1.75rem .75rem; font-size: 1rem; font-weight: 650; }
  :where(button, input, select) { font: inherit; }
  :where(button, input, select, summary) { min-block-size: 2.75rem; }
  button {
    padding: .5625rem .875rem; border: 1px solid var(--control-line); border-radius: var(--radius);
    background: var(--panel); color: var(--text); font-size: .875rem; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    transition: background-color 140ms ease-out, border-color 140ms ease-out, color 140ms ease-out;
  }
  button:hover:not(:disabled) { background: var(--hover); border-color: var(--accent); }
  button:active:not(:disabled) { background: var(--selected); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .primary:hover:not(:disabled), .primary:active:not(:disabled) { background: var(--accent); filter: brightness(.94); }
  :where(button, input, select, summary, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  :where(input, select) {
    inline-size: 100%; max-inline-size: 100%; min-inline-size: 0; padding: .625rem .75rem;
    border: 1px solid var(--control-line); border-radius: var(--radius); background: var(--panel); color: var(--text);
    font-size: 1rem;
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  input:user-invalid { border-color: var(--bad); }
  a { color: var(--accent); text-underline-offset: .2em; }
  svg { display: block; flex: none; }
  code { padding: .125rem .3rem; border-radius: .25rem; background: var(--bg); font: .8125rem/1.6 var(--mono); overflow-wrap: anywhere; }
  pre {
    max-block-size: 22rem; margin-block: .75rem; padding: 1rem; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); font: .8125rem/1.7 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; tab-size: 4;
  }
  :where(.panel, pre) { scrollbar-width: thin; scrollbar-color: var(--control-line) transparent; scrollbar-gutter: stable; overscroll-behavior: contain; }
  details { margin-block-start: 1.25rem; border-block-start: 1px solid var(--line); }
  summary { padding-block: .875rem; font-size: .875rem; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
  summary::marker { color: var(--muted); }
  summary .muted { margin-inline-start: .5rem; font-weight: 400; }
  ::selection { background: var(--accent); color: var(--on-accent); }
}

@layer layout {
  body { display: flex; flex-direction: column; block-size: 100dvh; }
  .app-header {
    display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem;
    padding: 1rem clamp(1rem, 2.5vw, 2.5rem); border-block-end: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: .75rem; font-size: 1.375rem; font-weight: 750; letter-spacing: -.04em; }
  .brand svg { inline-size: 1.75rem; block-size: 1.75rem; color: var(--accent); }
  .app-header h1 { padding-inline-start: 1.5rem; border-inline-start: 1px solid var(--line); }
  #toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-inline-start: auto; }
  #updated { margin-inline-end: .5rem; font-variant-numeric: tabular-nums; }
  #refresh { display: inline-flex; align-items: center; gap: .5rem; }
  #refresh svg { inline-size: 1rem; block-size: 1rem; }
  main { display: flex; flex: 1; flex-direction: column; gap: 1rem; inline-size: 100%; max-inline-size: 100rem; min-block-size: 0; margin-inline: auto; padding: 1.25rem clamp(1rem, 2.5vw, 2.5rem); }
  #dashboard { display: flex; flex: 1; flex-direction: column; gap: 1rem; min-block-size: 0; container: workspace / inline-size; }
  #sources { display: flex; flex: none; gap: .75rem 1.5rem; flex-wrap: wrap; }
  #filters { display: grid; grid-template-columns: minmax(13rem, 1.6fr) minmax(11rem, 1fr) minmax(9rem, .8fr) minmax(10rem, .85fr); gap: 1rem; align-items: end; }
  #filters label { display: grid; gap: .375rem; min-inline-size: 0; font-size: .8125rem; font-weight: 500; color: var(--muted); }
  #work { display: grid; grid-template-columns: minmax(21rem, .8fr) minmax(0, 1.6fr); flex: 1; min-block-size: 22rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--panel); }
  .panel { min-inline-size: 0; min-block-size: 0; overflow: auto; }
  #task-list { border-inline-end: 1px solid var(--line); border-start-start-radius: .75rem; border-end-start-radius: .75rem; }
  .list-heading { position: sticky; inset-block-start: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; padding: 1rem 1.25rem; border-block-end: 1px solid var(--line); background: var(--panel); }
  .list-heading h2 { font-size: 1rem; }
  #tasks { display: flex; flex-direction: column; }
  #detail { padding: 1.75rem 2rem; container: detail / inline-size; scroll-padding-block: 1rem; }
  .detail-heading { display: flex; gap: .75rem 1rem; flex-wrap: wrap; align-items: baseline; }
  .detail-heading h2 { flex: 1 1 15rem; }
  .overview { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.5rem; margin-block: 1.5rem; }
  .overview > div { min-inline-size: 0; }
  .overview dt { margin-block-end: .25rem; font-size: .8125rem; color: var(--muted); }
  .overview dd { margin: 0; font-size: .875rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-block: 1.5rem; padding-block-end: 1.5rem; border-block-end: 1px solid var(--line); }
  .detail-back { display: none; }
  @container detail (inline-size < 24rem) {
    .overview { grid-template-columns: 1fr; }
    .detail-actions > :where(button, .status-action) { flex: 1 1 auto; }
  }
  @container workspace (inline-size < 64rem) {
    #filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
    #filters label:first-child { grid-column: 1 / -1; }
  }
  @media (max-width: 64rem) {
    #work { grid-template-columns: minmax(17rem, .8fr) minmax(0, 1.2fr); }
    #detail { padding: 1.5rem; }
    #updated { flex-basis: 100%; text-align: end; font-size: .75rem; }
  }
  @media (max-width: 47.5rem) {
    body { block-size: auto; min-block-size: 100dvh; }
    .app-header { gap: .75rem 1rem; }
    .app-header h1 { padding-inline-start: 1rem; font-size: 1rem; }
    .brand { font-size: 1.25rem; }
    #toolbar { inline-size: 100%; }
    #updated { flex: 1; text-align: start; min-inline-size: 8rem; }
    #filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .75rem; }
    #filters label:last-child { grid-column: 1 / -1; }
    #work { display: block; min-block-size: 0; }
    #task-list { max-block-size: 36dvh; min-block-size: 10rem; border-inline-end: 0; border-start-end-radius: .75rem; border-end-start-radius: 0; }
    #detail { min-block-size: 16rem; border-block-start: 1px solid var(--line); padding: 1.25rem; }
    .detail-back { display: inline-flex; align-items: center; min-block-size: 2.75rem; margin-block-end: .5rem; font-size: .875rem; }
    .detail-heading { gap: .5rem; }
    .detail-heading h2 { flex-basis: 100%; }
    main { padding-block-end: max(1.25rem, env(safe-area-inset-bottom)); }
  }
}

@layer components {
  #auth { inline-size: min(100%, 26rem); margin: auto; padding: 2rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--panel); }
  #auth h2 { margin-block-end: 1.75rem; }
  #auth label { display: block; margin-block-end: .5rem; font-size: .875rem; font-weight: 600; }
  :where(#username, #credential) { margin-block-end: 1.25rem; }
  #auth .primary { inline-size: 100%; }
  #auth-error { margin-block-end: 1rem; }
  :where(#error, #auth-error) { color: var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: .8125rem; }
  .source { display: flex; flex-wrap: wrap; align-items: baseline; gap: .375rem .75rem; font-size: .8125rem; }
  .source-status { font-weight: 500; }
  .source-status::before { content: ""; display: inline-block; inline-size: .4375rem; block-size: .4375rem; margin-inline-end: .5rem; border-radius: 50%; background: currentColor; vertical-align: .125rem; }
  .online { color: var(--accent); }
  .offline { color: var(--bad); }
  .task { display: block; inline-size: 100%; padding: 1.125rem 1.25rem; border: 0; border-block-end: 1px solid var(--line); border-radius: 0; text-align: start; overflow-wrap: anywhere; }
  .task:focus-visible { outline-offset: -3px; }
  .task-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem .75rem; }
  .task strong { min-inline-size: 0; flex: 1 1 10rem; font-size: 1rem; line-height: 1.5; font-weight: 600; }
  .taskmeta { display: flex; flex-wrap: wrap; gap: .25rem .75rem; margin-block-start: .625rem; color: var(--muted); font-size: .75rem; font-weight: 400; }
  .taskmeta > span:first-child { flex-basis: 100%; font-size: .8125rem; overflow-wrap: anywhere; }
  :where(.tasktime, .taskactivity) { font-variant-numeric: tabular-nums; }
  .taskactivity { flex-basis: 100%; }
  .task.selected, .task.selected:hover { background: var(--selected); }
  .task.selected strong { color: var(--accent); }
  .status { display: inline-flex; align-items: center; gap: .375rem; padding: .1875rem .5rem; border-radius: .375rem; background: var(--bg); font-size: .75rem; font-weight: 600; white-space: nowrap; color: var(--muted); }
  .status.active { background: var(--selected); color: var(--accent); }
  .status.attention { background: var(--attention-bg); color: var(--attention); }
  .detail-heading .status { font-size: .8125rem; }
  .status-action { display: flex; flex-direction: column; gap: .375rem; }
  .status-action .offline { max-inline-size: 28ch; font-size: .8125rem; }
  .prose { max-inline-size: 72ch; font-size: 1rem; line-height: 1.9; overflow-wrap: anywhere; }
  .prose p { margin-block: .75rem; white-space: pre-line; }
  .prose :where(h3, h4) { margin-block: 1.5rem .5rem; font-size: .9375rem; line-height: 1.6; }
  .prose :where(ul, ol) { margin-block: .75rem; padding-inline-start: 1.5rem; }
  .prose li { margin-block: .375rem; }
  .process { margin-block-start: 0; }
  .process summary { font-size: .8125rem; font-weight: 500; }
  .process summary .muted { display: block; margin-block-start: .25rem; margin-inline-start: 1rem; font-size: .75rem; }
  .badge { display: inline-block; padding: .125rem .375rem; margin-inline-start: .5rem; border: 1px solid var(--line); border-radius: .25rem; font-size: .75rem; }
  .kv { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: .5rem 1rem; font-size: .8125rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  #steps { padding-inline-start: 1.5rem; margin-block: .5rem 1.5rem; font-size: .875rem; }
  #steps li { padding-block: .625rem; padding-inline-start: .25rem; }
  #steps li:not(:last-child) { border-block-end: 1px solid var(--line); }
  #steps li::marker { color: var(--muted); font: .8125rem var(--mono); }
  #steps .done { color: var(--muted); }
  #steps .current { font-weight: 600; }
  .step-state { display: inline-block; padding-inline: .375rem; margin-inline-start: .5rem; border-radius: .25rem; background: var(--bg); font-size: .75rem; color: var(--muted); }
  .current .step-state { background: var(--selected); color: var(--accent); }
  .empty { padding: 1.5rem 1.25rem; color: var(--muted); }
  #detail:not([data-task]) { display: grid; place-content: center; }
  #detail:not([data-task]) h2 { font-size: 1rem; font-weight: 500; color: var(--muted); }
  #more { inline-size: 100%; border: 0; border-radius: 0; color: var(--accent); }
  .skip-link { position: fixed; z-index: 2; inset-block-start: 1rem; inset-inline-start: 1rem; padding: .75rem 1rem; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--panel); }
  .skip-link:not(:focus) { clip-path: inset(50%); inline-size: 1px; block-size: 1px; padding: 0; overflow: hidden; }
  dialog { inline-size: min(28rem, calc(100% - 2rem)); max-block-size: calc(100dvh - 2rem); padding: 1.75rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--panel); color: var(--text); }
  dialog h2 { font-size: 1.25rem; }
  dialog p { margin-block: 1rem 1.5rem; }
  dialog form { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; }
  dialog:modal { overscroll-behavior: contain; }
  dialog::backdrop { background: rgb(10 24 28 / .45); overflow: hidden; overscroll-behavior: contain; }
}

@layer preferences {
  :where(.hidden, [hidden], #error:empty, #auth-error:empty) { display: none !important; }
  @media (pointer: coarse) { :where(button, input, select, summary) { min-block-size: 3rem; } }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  @media (forced-colors: active) {
    .task.selected { outline: 2px solid Highlight; outline-offset: -3px; }
    .status { border: 1px solid currentColor; }
  }
}
</style>
</head>
<body>
<a class="skip-link" href="#detail">跳至任務詳情</a>
<header class="app-header">
  <div class="brand" translate="no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 5 7 7-7 7m11 0h6"/></svg>WebCodex</div>
  <h1>任務中心</h1>
  <div id="toolbar" hidden><span id="updated" class="muted"></span><button id="refresh" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg>重新整理</button><button id="logout" type="button">登出</button></div>
</header>
<main>
  <p id="boot" class="muted">連線中…</p>
  <form id="auth" method="post" action="/api/manage/login" autocomplete="on" aria-labelledby="auth-title" hidden>
    <h2 id="auth-title">登入</h2>
    <div id="username-field"><label for="username">帳號</label><input id="username" name="username" type="text" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" required></div>
    <label id="credential-label" for="credential">密碼</label><input id="credential" name="password" type="password" autocomplete="current-password" spellcheck="false" enterkeyhint="go" aria-describedby="auth-error" required>
    <p id="auth-error" role="alert"></p><button id="login" class="primary" type="submit">登入</button>
  </form>
  <p id="error" role="alert"></p>
  <div id="dashboard" hidden>
    <div id="sources"></div>
    <search id="filters" aria-label="篩選任務">
      <label for="query">搜尋任務<input id="query" name="q" type="search" placeholder="名稱、專案或任務 ID" autocorrect="off" autocapitalize="none" spellcheck="false"></label>
      <label for="project-filter">專案<select id="project-filter" name="project"><option value="">全部專案</option></select></label>
      <label for="source-filter">來源<select id="source-filter" name="source"><option value="">全部來源</option></select></label>
      <label for="state-filter">狀態<select id="state-filter" name="state"><option value="unfinished">未完成</option><option value="active">執行／排隊中</option><option value="attention">需要處理</option><option value="unconfirmed">執行狀態待確認</option><option value="completed">已完成</option><option value="archived">已封存</option><option value="all">全部任務</option></select></label>
    </search>
    <div id="work">
      <section id="task-list" class="panel" aria-labelledby="task-list-title"><div class="list-heading"><h2 id="task-list-title" tabindex="-1">任務</h2><p id="results" class="muted" role="status"></p></div><div id="tasks"></div><button id="more" type="button" hidden>載入更多</button></section>
      <section id="detail" class="panel" aria-label="任務詳情" tabindex="-1"><h2>選擇任務</h2></section>
    </div>
  </div>
</main>
<dialog id="complete-dialog" aria-labelledby="complete-title" aria-describedby="complete-description">
  <h2 id="complete-title">標記任務完成？</h2>
  <p id="complete-description">仍有工作執行中。標記完成後，這些工作會繼續。</p>
  <form method="dialog"><button value="cancel" autofocus>取消</button><button value="complete" class="primary">標記完成</button></form>
</dialog>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const key = task => JSON.stringify([task.source_id, task.id]);
  const stateNames = {ready:'閒置',running:'執行中',waiting:'等待中',completed:'已完成',failed:'失敗',unknown:'狀態未知',queued:'排隊中',active:'處理中',interrupted:'已中斷',cancelled:'已取消',timed_out:'逾時',runner_offline:'執行環境離線',observing:'背景工作執行中',waiting_runner:'執行環境離線',waiting_operator:'等待回覆',pending_approval:'等待核准',needs_attention:'閒置',project_changed:'專案位置已變更',needs_confirmation:'待確認',unconfirmed:'待確認',pending:'待處理',in_progress:'進行中',succeeded:'成功'};
  const label = value => stateNames[value] || value || '—';
  const dateFormat = new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const stamp = value => value ? dateFormat.format(new Date(value*1000)) : '—';
  const node = (tag, text, cls) => {const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;if(tag==='button')e.type='button';return e;};
  function relativeStamp(value) {const seconds=Math.max(0,Math.floor(Date.now()/1000-value)),elapsed=seconds<60?seconds+' 秒':seconds<3600?Math.floor(seconds/60)+' 分鐘':seconds<86400?Math.floor(seconds/3600)+' 小時':Math.floor(seconds/86400)+' 天';return stamp(value)+'（'+elapsed+'前）';}
  function timeNode(value,relative=false) {
    const time=node('time',value?(relative?relativeStamp(value):stamp(value)):'—');
    if(value){time.dateTime=new Date(value*1000).toISOString();if(relative)time.dataset.relative=value;}return time;
  }
  function updateClocks() {if(authenticated && !document.hidden)for(const time of document.querySelectorAll('time[data-relative]')){const text=relativeStamp(Number(time.dataset.relative));if(time.textContent!==text)time.textContent=text;}}
  const processStamp = task => Math.max(0,...(task.processes || []).map(p=>p.observed_at || 0));
  const toolStamp = task => {const a=task.liveness?.conversation;return a?.finished_at || a?.started_at;};
  const workObserved = task => task?.liveness?.observed_at || task?.observed_at || 0;
  const runnerObserved = task => task?.liveness?.runner_observed_at || workObserved(task);
  function mergeObserved(current,incoming) {
    const newer=workObserved(current)>workObserved(incoming)?current:incoming,older=newer===current?incoming:current;
    const task={...older,...newer,liveness:{...older?.liveness,...newer?.liveness}},runner=runnerObserved(current)>runnerObserved(incoming)?current:incoming;
    task.liveness.observed_at=workObserved(newer);
    for(const field of ['runner_online','stale'])if(runner && field in runner)task[field]=runner[field];
    for(const field of ['runner_last_seen','data_freshness','runner_observed_at'])if(runner?.liveness && field in runner.liveness)task.liveness[field]=runner.liveness[field];
    task.liveness.runner_observed_at=runnerObserved(runner);
    return task;
