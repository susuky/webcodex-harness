name: Ubuntu and Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WEBCODEX_TEST_SKILL_COMMIT: 41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Ubuntu tools and virtual desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep xvfb xauth python3-tk xdotool
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: uv sync --locked --extra computer
      - name: Install optional browser provider
        run: npm install --prefix "${{ runner.temp }}/webcodex-browser" --ignore-scripts --no-audit --no-fund --save-exact @playwright/mcp@0.0.80
      - run: uv run webcodex doctor
      - run: cargo --version
      - run: rg --version
      - run: uv run pytest -q -ra
        env:
          WEBCODEX_TEST_BROWSER_MCP: '${{ runner.temp }}/webcodex-browser/node_modules/@playwright/mcp/cli.js'
      - name: Verify computer use on an isolated X11 desktop
        if: runner.os == 'Linux'
        env:
          WEBCODEX_TEST_DESKTOP: '1'
          XLOCALEDIR: /usr/share/X11/locale
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' uv run --extra computer pytest -q tests/test_computer_live.py
      # Hosted Windows runners have no multi-monitor desktop; opt-in live steps are in docs/WINDOWS_RUNNER.md.
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - name: Build with a synthetic private attachment
        run: |
          python -c "from pathlib import Path; p=Path('.codex-remote-attachments/release-probe.txt'); p.parent.mkdir(exist_ok=True); p.write_text('must not ship')"
          uv build
      - name: Check distribution contents
        run: uv run pytest -q tests/test_distribution.py
        env:
          WEBCODEX_TEST_DIST: dist
      - run: uvx twine check dist/*
      - name: Check installation without desktop extras
        run: uv run --isolated --no-project --with . webcodex --version
