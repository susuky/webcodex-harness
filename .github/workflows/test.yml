name: Ubuntu and Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WEBCODEX_TEST_SKILL_COMMIT: 41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ripgrep on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: uv sync --locked
      - run: uv run webcodex doctor
      - run: cargo --version
      - run: rg --version
      - run: uv run pytest -q -ra
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv build
