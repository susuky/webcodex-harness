[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcodex-harness"
version = "0.1.0"
description = "A self-hosted MCP coding harness with outbound runners and durable tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.25,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "PyYAML>=6,<7",
  "pywin32>=311; sys_platform == 'win32'",
  "pywinpty>=3,<4; sys_platform == 'win32'",
]

[project.scripts]
webcodex = "webcodex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webcodex"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110", "ASYNC221"]
