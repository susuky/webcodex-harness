[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webcodex-harness"
dynamic = ["version"]
description = "A self-hosted MCP coding harness with outbound runners and durable tasks"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "mcp>=1.25,<2",
  "pydantic>=2.11,<3",
  "starlette>=0.27,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "PyYAML>=6,<7",
  "pywin32>=311; sys_platform == 'win32'",
  "pywinpty>=3,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
computer = ["PyAutoGUI>=0.9.54,<1", "Pillow>=11,<13"]

[project.scripts]
webcodex = "webcodex.cli:main"

[tool.hatch.version]
path = "src/webcodex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/webcodex"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110", "ASYNC221"]
